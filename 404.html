<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada | ERMIF</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f7f7; color: #153c4c; font: 700 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 480px; padding: clamp(24px, 6vw, 44px); background: #fff; border: 1px solid #d8e6e7; border-radius: 20px; box-shadow: 0 12px 40px #153c4c0a; }
      .brand { color: #008768; letter-spacing: .12em; }
      .code { margin: 20px 0 0; font-size: 64px; line-height: 1; }
      h1 { margin: 16px 0 12px; font-size: clamp(24px, 5vw, 30px); line-height: 1.2; }
      p { margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #008768; color: #fff; text-decoration: none; }
      a:hover { background: #006c53; }
      a:focus-visible { outline: 3px solid #153c4c; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">ERMIF</div>
      <p class="code">404</p>
      <h1>Página no encontrada</h1>
      <p>La dirección que abriste no existe. Comprueba el enlace o vuelve al inicio para acceder a ERMIF.</p>
      <a href="/">Volver a ERMIF</a>
    </main>
  </body>
</html>
